# App of apps. The only thing applied by hand (by bootstrap/up.sh); everything else is in argocd/apps/.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KulmeetSJ/gitops-demo-platform.git
    targetRevision: main
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Argo CD adds pre-delete finalizers at runtime to apps whose charts have pre-delete hooks (e.g. Kyverno).
  # They are controller-owned state, not drift.
  ignoreDifferences:
    - group: argoproj.io
      kind: Application
      jsonPointers: [/metadata/finalizers]
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["RespectIgnoreDifferences=true"]
