# Admission policies, applied after Kyverno itself (wave 0 > -1). Enforced in dev, staging and prod.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kyverno-policies
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    repoURL: https://github.com/KulmeetSJ/gitops-demo-platform.git
    targetRevision: main
    path: policies/kyverno
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["ServerSideApply=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
