apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers: ["resources-finalizer.argocd.argoproj.io"]
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 93.4.0
    helm:
      releaseName: kube-prometheus-stack
      valuesObject:
        # Laptop profile: Prometheus + operator + kube-state-metrics. No Grafana/Alertmanager/node-exporter yet.
        grafana: { enabled: false }
        alertmanager: { enabled: false }
        nodeExporter: { enabled: false }
        prometheus:
          prometheusSpec:
            retention: 2d
            scrapeInterval: 15s
            # Pick up ServiceMonitors/rules from every namespace, not just this release's.
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            resources:
              requests: { cpu: 100m, memory: 400Mi }
              limits: { memory: 1Gi }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    retry: { limit: 10, backoff: { duration: 15s, factor: 2, maxDuration: 3m } }
