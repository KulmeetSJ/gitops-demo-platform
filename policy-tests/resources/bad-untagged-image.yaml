apiVersion: v1
kind: Pod
metadata:
  name: bad-untagged-image
  namespace: dev
spec:
  securityContext: { runAsNonRoot: true, runAsUser: 65532 }
  containers:
    - name: app
      image: ghcr.io/kulmeetsj/gitops-demo-app
      resources:
        requests: { cpu: 100m, memory: 128Mi }
        limits: { cpu: 500m, memory: 256Mi }
