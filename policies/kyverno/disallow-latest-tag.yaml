apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow latest and untagged images
    policies.kyverno.io/category: Pod Security / Supply Chain
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      Every image must be pinned to an explicit tag or digest, and the tag must not be latest. A mutable tag makes deployments unrepeatable and rollbacks meaningless.
spec:
  validationActions: [Deny]          # Enforce: reject at admission
  evaluation:
    background: { enabled: true }    # also report on resources that already exist
  matchConstraints:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values: [dev, staging, prod]
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  # Also check Deployments/StatefulSets etc. directly, so a bad manifest fails at apply time, not later at pod creation.
  autogen:
    podControllers:
      controllers: [deployments, statefulsets, daemonsets, jobs, cronjobs, replicasets]
  variables:
    - name: containers
      expression: >-
        object.spec.containers
        + object.spec.?initContainers.orValue([])
        + object.spec.?ephemeralContainers.orValue([])
  validations:
    - expression: >-
        variables.containers.all(c,
          (c.image.contains('@') || c.image.split('/')[size(c.image.split('/')) - 1].contains(':'))
          && !c.image.endsWith(':latest'))
      message: "Images must use an explicit, immutable tag or digest; ':latest' and untagged images are not allowed."
