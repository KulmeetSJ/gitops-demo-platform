# Lean Argo CD for a laptop: no SSO, no notifications, UI over port-forward.
dex:
  enabled: false
notifications:
  enabled: false
configs:
  params:
    server.insecure: true
  cm:
    # Poll Git every 60s (default 180s). No inbound webhooks to a laptop cluster.
    timeout.reconciliation: 60s
controller:
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 768Mi }
repoServer:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
server:
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { memory: 256Mi }
applicationSet:
  resources:
    requests: { cpu: 20m, memory: 64Mi }
    limits: { memory: 256Mi }
redis:
  resources:
    requests: { cpu: 20m, memory: 32Mi }
    limits: { memory: 128Mi }
